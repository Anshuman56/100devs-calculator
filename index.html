<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculater</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="frame">
      <input class="InputOutput"></input>
      <div class="keys">
        <div class="allkeys">
          <button class="key" onclick="toDisplay('7')">7</button>
          <button class="key" onclick="toDisplay('8')">8</button>
          <button class="key" onclick="toDisplay('9')">9</button>
          <button class="key" onclick="toDisplay('/')">/</button>
          <button class="key" onclick="toDisplay('4')">4</button>
          <button class="key" onclick="toDisplay('5')">5</button>
          <button class="key" onclick="toDisplay('6')">6</button>
          <button class="key" onclick="toDisplay('*')">X</button>
          <button class="key" onclick="toDisplay('1')">1</button>
          <button class="key" onclick="toDisplay('2')">2</button>
          <button class="key" onclick="toDisplay('3')">3</button>
          <button class="key" onclick="toDisplay('+')">+</button>
          <button class="key" onclick="toDisplay('0')">0</button>
          <button class="key" onclick="toDisplay('.')">.</button>
          <button class="key" onclick="calculate()">=</button>
          <button class="key" onclick="toDisplay('-')">-</button>
        </div>
      </div>
    </section>
    <script src="js/main.js"></script>
  </body>
</html>
